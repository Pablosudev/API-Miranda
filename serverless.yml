service: miranda-backend
package:
  patterns:
    - "!./**"
    - "package.json"
    - "node_modules/**"
    - "dist/**"
    - "data/**"
    - "public/**"
    - "!**/.env"
provider:
  name: aws
  region: eu-west-3
  runtime: nodejs22.x
  environment:
    MONGO_URI: ${env:MONGO_URI}
functions:
  app:
    handler: dist/src/index.handler
    events:
      - http:
          path: /
          method: ANY
          cors: true
      - http:
          path: /{proxy+}
          method: ANY
          cors: true






